<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="/assets/">
<title>INCPT Wallet reel</title>
<link rel="stylesheet" href="/node_modules/@fontsource-variable/roboto-flex/full.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/inter/opsz.css">
<style>
  :root { --ink: #0a1022; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #d6e7fc; }
  #bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 2600px; perspective-origin: 540px 960px; }
  #cam { position: absolute; left: 540px; top: 960px; width: 0; height: 0; transform-style: preserve-3d; }
  .node { position: absolute; transform-style: preserve-3d; }
  .node.flat { transform-style: flat; }
  img.fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  img.abs { position: absolute; display: block; }
  .screen { position: absolute; width: 920px; height: 2000px; overflow: hidden; background: #000; transform: translateZ(0.2px); }
  .pageclip { position: absolute; left: 0; width: 920px; height: 1700px; overflow: hidden; }
  .phone { }
  .tap .disc { position: absolute; inset: 0; border-radius: 50%; background: rgba(168, 208, 255, 0.58); border: 4px solid rgba(255, 255, 255, 0.96); box-sizing: border-box; }
  .tap .halo { position: absolute; inset: -14px; border-radius: 50%; border: 3px solid rgba(150, 196, 255, 0.55); box-sizing: border-box; }
  .glass { border-radius: 72px; background: linear-gradient(170deg, rgba(255,255,255,0.62), rgba(255,255,255,0.34) 55%, rgba(236,244,255,0.42)); border: 3px solid rgba(255,255,255,0.92); box-sizing: border-box; box-shadow: 0 30px 70px -20px rgba(22,48,104,0.28), inset 0 2px 0 rgba(255,255,255,0.9); }
  #text { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
  .headline { position: absolute; text-align: center; font-family: 'Roboto Flex Variable', sans-serif; text-transform: uppercase; white-space: nowrap; }
  .headline .line { display: block; }
  .headline .word { display: inline-block; margin: 0 0.12em; will-change: transform; }
  .sub { font-family: 'Inter Variable', sans-serif; text-transform: none; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 46%, rgba(0,0,0,0) 58%, rgba(18, 46, 110, 0.20) 100%); pointer-events: none; }
  #grain { position: absolute; inset: 0; background-size: 1080px 1920px; image-rendering: auto; opacity: 0.075; mix-blend-mode: overlay; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="world"><div id="cam"></div></div>
  <div id="text"></div>
</div>
<script src="/src/engine.js"></script>
<script src="/src/scenes.js"></script>
<script>boot();</script>
</body>
</html>
